# CatWAN USB Stick - Kconfig
# SPDX-License-Identifier: Apache-2.0

# Serial for USB CDC-ACM
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# USB device stack
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

# SPI and LoRa (RFM95 / SX1276)
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE=y
CONFIG_LORA_SX127X=y

# Persistent storage (for future saved settings)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Unique serial number from chip ID
CONFIG_HWINFO=y

# Logging disabled for production
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_USBD_LOG_LEVEL_WRN=n
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=n
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=n

# USB product strings
CONFIG_SAMPLE_USBD_PID=0xBABB
CONFIG_SAMPLE_USBD_PRODUCT="CatWAN USB Stick"
CONFIG_SAMPLE_USBD_MANUFACTURER="Electronic Cats"
